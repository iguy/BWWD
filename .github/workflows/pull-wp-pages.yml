name: Pull WordPress pages

# Read-only against WordPress. Saves pages + images into migration/pages/.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: Page slugs, comma separated
        required: true
        default: about,contact

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/pull-wp-pages.mjs "${{ inputs.slugs }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add migration
          git diff --cached --quiet || git commit -m "Pull pages from WordPress"
          git pull --rebase origin main
          git push
