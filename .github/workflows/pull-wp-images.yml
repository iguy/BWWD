name: Pull WordPress images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/pull-wp-images.mjs
      - .github/workflows/pull-wp-images.yml

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/pull-wp-images.mjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/photography src/content/photography
          git diff --cached --quiet || git commit -m "Move photography images off WordPress"
          git push
